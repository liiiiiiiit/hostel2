name: Staging isolation
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:isolation
      - run: npm test
      - run: npm run build
      - run: npm run test:built
      - name: Prepare disposable runner only
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx apache2-utils
          test ! -e /opt/hostel2-staging
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/hostel2-staging
      - name: Real isolated staging server and HTTPS proxy
        run: node scripts/staging-smoke.mjs
