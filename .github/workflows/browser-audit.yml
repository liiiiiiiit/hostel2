name: Browser and responsive audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser workflows
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_ARTIFACTS_DIR: test-artifacts/workflows
          RESEND_API_KEY: ''
          NOTIFICATION_FROM: ''
          TELEGRAM_BOT_TOKEN: ''
          GEMINI_API_KEY: ''
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-audit
          path: test-artifacts
          retention-days: 7
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [fa, en, ru, hy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mobile and tablet matrix
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_ARTIFACTS_DIR: test-artifacts/responsive
          RESPONSIVE_LANGUAGES: ${{ matrix.language }}
        run: npm run test:responsive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: responsive-${{ matrix.language }}
          path: test-artifacts/responsive
          retention-days: 7

  ipad-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install WebKit and system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: iPad search fields and date flows
        env:
          BROWSER_ARTIFACTS_DIR: test-artifacts/ipad
        run: npm run test:ipad
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: ipad-webkit
          path: test-artifacts/ipad
          retention-days: 7
