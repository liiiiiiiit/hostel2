name: Browser and responsive audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser workflows
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_ARTIFACTS_DIR: test-artifacts/workflows
          RESEND_API_KEY: ''
          NOTIFICATION_FROM: ''
          TELEGRAM_BOT_TOKEN: ''
          GEMINI_API_KEY: ''
        run: npm run test:browser
      - name: Mobile and tablet matrix
        if: ${{ !cancelled() }}
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_ARTIFACTS_DIR: test-artifacts/responsive
        run: npm run test:responsive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-audit
          path: test-artifacts
          retention-days: 7
