# Install as /etc/systemd/system/hostel2.service.d/persistence.conf only AFTER promotion.
[Service]
WorkingDirectory=/opt/hostel2/app
EnvironmentFile=/opt/hostel2/config/production.env
Environment=PATH=/opt/hostel2/node/bin:/usr/bin:/bin
UMask=0077
ExecStart=
ExecStart=/usr/bin/flock --shared --nonblock /opt/hostel2/config/writers.lock /opt/hostel2/node/bin/node --import tsx server/dev.ts
