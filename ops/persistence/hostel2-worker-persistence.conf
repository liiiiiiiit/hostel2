# Use with the ACTUAL worker service name discovered on the VPS, not an assumed name.
[Service]
WorkingDirectory=/opt/hostel2/app
EnvironmentFile=/opt/hostel2/config/production.env
Environment=PATH=/opt/hostel2/node/bin:/usr/bin:/bin
UMask=0077
ExecStart=
ExecStart=/usr/bin/flock --shared --nonblock /opt/hostel2/config/writers.lock /opt/hostel2/node/bin/node --import tsx scripts/worker.ts
