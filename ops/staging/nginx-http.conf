# Bootstrap only: obtain the certificate before enabling nginx-https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name test.yerevanhub.ir;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hostel2-staging-acme;
        auth_basic off;
    }
    location / { return 301 https://test.yerevanhub.ir$request_uri; }
}
