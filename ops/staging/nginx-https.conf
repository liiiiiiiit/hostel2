server {
    listen 80;
    listen [::]:80;
    server_name test.yerevanhub.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/hostel2-staging-acme; auth_basic off; }
    location / { return 301 https://test.yerevanhub.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.yerevanhub.ir;
    ssl_certificate /etc/letsencrypt/live/test.yerevanhub.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.yerevanhub.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "YEREVANHUB staging - private";
    auth_basic_user_file /etc/nginx/hostel2-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/hostel2-staging.access.log;
    error_log /var/log/nginx/hostel2-staging.error.log;
    client_max_body_size 5m;
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
